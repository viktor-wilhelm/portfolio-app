name: Deploy Portfolio to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Trust IONOS SSH host key
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts

      - name: Deploy portfolio via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" sftp://"$SFTP_HOST" <<EOF
          mirror -R --verbose assets /portfolio/assets
          mirror -R --verbose css /portfolio/css
          mirror -R --verbose js /portfolio/js

          put index.html -o /portfolio/index.html
          put legal-notice.html -o /portfolio/legal-notice.html
          put privacy-policy.html -o /portfolio/privacy-policy.html
          put project-detail.html -o /portfolio/project-detail.html
          put mail.php -o /portfolio/mail.php

          bye
          EOF

      - name: Deploy portfolio to Developer Akademie
        env:
          DA_FTP_HOST: ${{ secrets.DA_FTP_HOST }}
          DA_FTP_USERNAME: ${{ secrets.DA_FTP_USERNAME }}
          DA_FTP_PASSWORD: ${{ secrets.DA_FTP_PASSWORD }}
        run: |
          lftp -u "$DA_FTP_USERNAME","$DA_FTP_PASSWORD" ftp://"$DA_FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no

          mirror -R --verbose assets /portfolio-app/assets
          mirror -R --verbose css /portfolio-app/css
          mirror -R --verbose js /portfolio-app/js

          put index.html -o /portfolio-app/index.html
          put legal-notice.html -o /portfolio-app/legal-notice.html
          put privacy-policy.html -o /portfolio-app/privacy-policy.html
          put project-detail.html -o /portfolio-app/project-detail.html
          put mail.php -o /portfolio-app/mail.php

          bye
          EOF