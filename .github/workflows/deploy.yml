name: Deploy Portfolio to IONOS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Trust IONOS SSH host key
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SFTP_HOST" >> ~/.ssh/known_hosts

      - name: Deploy portfolio via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          lftp -u "$SFTP_USERNAME","$SFTP_PASSWORD" sftp://"$SFTP_HOST" <<EOF
          mirror -R --verbose assets /assets
          mirror -R --verbose css /css
          mirror -R --verbose js /js

          put index.html -o /index.html
          put legal-notice.html -o /legal-notice.html
          put privacy-policy.html -o /privacy-policy.html
          put project-detail.html -o /project-detail.html
          put mail.php -o /mail.php

          bye
          EOF