<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join – Viktor Wilhelm</title>
    <script src="js/project-detail.js"></script>
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/04_Hero/vw-favicon.png" />
    <!-- Fonts -->
    <link rel="stylesheet" href="css/fonts.css" />
    <!-- AOS (Animate On Scroll) -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css" />
    <!-- Styles -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components/navbar.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/sections/project-detail.css" />
  </head>
  <body>
    <!-- ===== HEADER / NAVIGATION ===== -->
    <div id="site-header"></div>

    <!-- ===== PROJECT DETAIL ===== -->
    <main class="detail">
      <!-- Notebook paper background -->
      <picture>
        <source
          media="(max-width: 900px)"
          srcset="assets/img/01_Background/Design%20Size%20Relation@3x/Note-book-paper.png"
        />
        <img
          src="assets/img/01_Background/Design Size Relation@3x/Note-book-paper.png"
          alt=""
          class="detail__bg"
          aria-hidden="true"
          draggable="false"
        />
      </picture>

      <div class="detail__container">
        <!-- Back link -->
        <a href="index.html#projects" class="detail__back text-bold-18" draggable="false">
          <img
            src="assets/img/07_Projects/Breadcrumb arrow 1.png"
            alt=""
            width="24"
            height="24"
            aria-hidden="true"
            draggable="false"
          />
          <span data-i18n="detailBackLink">Go Back</span>
        </a>

        <!-- Two-column layout -->
        <div class="detail__layout">
          <!-- Left: text content -->
          <div class="detail__content" data-aos="fade-right">
            <div class="detail__title-wrap">
              <h1 class="detail__title"></h1>
              <img
                src="assets/img/00_Hand-drawn lines/01_About me/Color option 1.png"
                alt=""
                aria-hidden="true"
                class="detail__title-underline"
              />
            </div>

            <div class="detail__section">
              <h2 class="detail__section-heading" data-i18n="detailDescriptionHeading">Description</h2>
              <p class="detail__description"></p>
            </div>

            <div class="detail__section">
              <h2 class="detail__section-heading" data-i18n="detailImplHeading">Implementation Details</h2>
              <p class="detail__impl"></p>
            </div>

            <div class="detail__section">
              <p class="detail__duration-label">
                <span data-i18n="detailDurationLabel">Duration:</span>
                <span class="detail__duration-value"></span>
              </p>
            </div>

            <!-- Tech stack tags -->
            <div class="detail__tech" aria-label="Tech stack"></div>
          </div>
          <!-- /.detail__content -->

          <!-- Right: project image + buttons -->
          <div class="detail__visual" data-aos="fade-left">
            <div class="detail__image-wrap">
              <img src="" alt="" class="detail__image" draggable="false" />
              <img src="" alt="" class="detail__sticker" aria-hidden="true" draggable="false" />
            </div>
            <!-- Action buttons -->
            <div class="detail__actions">
              <a
                href="#"
                class="detail__btn detail__btn--github"
                target="_blank"
                rel="noopener noreferrer"
                draggable="false"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <path
                    d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.757-1.333-1.757-1.089-.744.084-.729.084-.729 1.205.084 1.84 1.236 1.84 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.418-1.305.762-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
                  />
                </svg>
                GitHub
              </a>
              <a
                href="#"
                class="detail__btn detail__btn--live"
                target="_blank"
                rel="noopener noreferrer"
                draggable="false"
                data-i18n="detailLiveCta"
              >
                Live Test
              </a>
            </div>
          </div>
          <!-- /.detail__visual -->
        </div>
        <!-- /.detail__layout -->

        <!-- Previous / Next Project -->
        <div class="detail__next">
          <a href="#" class="detail__prev-btn" aria-label="Previous Project" draggable="false">
            <img
              src="assets/img/00_Hand-drawn lines/03_Portfolio/Breadcrumbs/Next project arrow 1.png"
              alt=""
              width="24"
              height="24"
              aria-hidden="true"
              draggable="false"
            />
          </a>
          <a href="#" class="detail__next-btn" draggable="false">
            <span data-i18n="detailNextProject">Next Project</span>
            <img
              src="assets/img/00_Hand-drawn lines/03_Portfolio/Breadcrumbs/Next project arrow 1.png"
              alt=""
              width="24"
              height="24"
              aria-hidden="true"
              draggable="false"
            />
          </a>
        </div>
      </div>
      <!-- /.detail__container -->
    </main>

    <!-- ===== MOBILE NAV OVERLAY ===== -->
    <div id="site-overlay"></div>

    <!-- Scripts -->
    <script src="js/header.js"></script>
    <script src="js/translations.js"></script>
    <script src="js/language.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/scroll-reveal.js" defer></script>
  </body>
</html>
